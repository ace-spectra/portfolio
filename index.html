<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/public/images/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Ace Spectra</title>
    <meta property="og:title" content="Ace Spectra | Portfolio">
    <meta property="og:description" content="Building websites, software and exploring ideas through code. Explore my projects, skills, and journey as a developer.">
    <meta property="og:image" content="https://acespectra.pages.dev/public/images/Screenshot_27-7-2026_214838_acespectra.pages.dev.jpeg">
    <meta property="og:url" content="https://acespectra.pages.dev/">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#0b0b0f">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Ace Spectra | Portfolio">
    <meta name="twitter:description" content="Building websites, software and exploring ideas through code.">
    <meta name="twitter:image" content="https://acespectra.pages.dev/public/images/Screenshot_27-7-2026_214838_acespectra.pages.dev.jpeg">
    <meta name="author" content="Ace Spectra">
</head>
<body>
    <div class="cursor"></div>
    <nav class="nav">
        <a href="#home" class="logo">ACE <span>SPECTRA</span></a>
        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>
    <main>
        <section class="hero" id="home">
            <div class="shape shape-ring"></div>
            <div class="shape shape-square"></div>
            <div class="shape shape-dot-grid"></div>
            <div class="shape shape-line"></div>
            <div class="shape shape-blur"></div>
            <div class="shape shape-star">✦</div>
            <div class="hero-content">
                <h1 class="hero-title reveal">
                    ACE
                    <br>
                    <span class="outline indent">SPECTRA</span>
                </h1>
            </div>
        </section>
    </main>
    <script>
        const cursor = document.querySelector(".cursor");

        document.addEventListener("mousemove", event => {
            cursor.style.left = `${event.clientX}px`;
            cursor.style.top = `${event.clientY}px`;
        });

        document.querySelectorAll("a").forEach(link => {
            link.addEventListener("mouseenter", () => {
                cursor.classList.add("active");
            });

            link.addEventListener("mouseleave", () => {
                cursor.classList.remove("active");
            });
        });

        const revealElements = document.querySelectorAll(".reveal");

        const revealObserver = new IntersectionObserver(
            entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("visible");
                        revealObserver.unobserve(entry.target);
                    }
                });
            },
            {
                threshold: 0.12
            }
        );

        revealElements.forEach(element => {
            revealObserver.observe(element);
        });

        const parallaxShapes = document.querySelectorAll(".shape");

        window.addEventListener("mousemove", event => {
            const x = (event.clientX / window.innerWidth - 0.5) * 2;
            const y = (event.clientY / window.innerHeight - 0.5) * 2;

            parallaxShapes.forEach((shape, index) => {
                const strength = (index + 1) * 4;
                shape.style.transform = `translate(${x * strength}px, ${y * strength}px)`;
            });
        });

        const hero = document.querySelector(".hero");

        window.addEventListener("scroll", () => {
            const scroll = window.scrollY;

            if (scroll < window.innerHeight) {
                hero.querySelector(".hero-content").style.transform = `translateY(${scroll * 0.12}px)`;
            }
        });
    </script>
</body>
</html>
