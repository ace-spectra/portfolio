<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/public/images/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Ace Spectra</title>
    <meta property="og:title" content="Ace Spectra | Portfolio">
    <meta property="og:description" content="Building websites, software and exploring ideas through code. Explore my projects, skills, and journey as a developer.">
    <meta property="og:image" content="https://acespectra.pages.dev/public/images/Screenshot_27-7-2026_214838_acespectra.pages.dev.jpeg">
    <meta property="og:url" content="https://acespectra.pages.dev/">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#0b0b0f">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Ace Spectra | Portfolio">
    <meta name="twitter:description" content="Building websites, software and exploring ideas through code.">
    <meta name="twitter:image" content="https://acespectra.pages.dev/public/images/Screenshot_27-7-2026_214838_acespectra.pages.dev.jpeg">
    <meta name="author" content="Ace Spectra">
    <style>
        :root {
            --bg: #08080b;
            --text: #f4f4f0;
            --muted: #8d8d95;
            --soft: #b8b8bf;
            --accent: #ffffff;
            --surface: rgba(255, 255, 255, 0.055);
            --surface-hover: rgba(255, 255, 255, 0.09);
            --border: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Manrope', sans-serif;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        ::selection {
            background: #fff;
            color: #08080b;
        }

        .cursor {
            position: fixed;
            width: 12px;
            height: 12px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%);
            transition: width 0.25s ease, height 0.25s ease, background 0.25s ease;
            mix-blend-mode: difference;
        }

        .cursor.active {
            width: 48px;
            height: 48px;
            background: white;
        }

        .nav {
            position: fixed;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            width: min(92%, 1100px);
            padding: 10px 12px 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border);
            background: rgba(8, 8, 11, 0.7);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border-radius: 100px;
            z-index: 100;
        }

        .logo {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .logo span {
            color: var(--muted);
        }

        .nav-links {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .nav-links a {
            padding: 10px 15px;
            border-radius: 100px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            transition: 0.25s ease;
        }

        .nav-links a:hover {
            background: var(--surface-hover);
            color: white;
        }

        .nav-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: "DM Mono", monospace;
            font-size: 9px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
        }

        .hero {
            min-height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            padding: 140px 7vw 100px;
            overflow: hidden;
        }

        .hero-content {
            position: relative;
            z-index: 5;
            width: 100%;
        }

        .hero-title {
            font-size: clamp(70px, 13vw, 190px);
            line-height: 0.82;
            letter-spacing: -0.09em;
            font-weight: 800;
            max-width: 1100px;
        }

        .hero-title .outline {
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.55);
        }

        .hero-title .indent {
            margin-left: 12vw;
        }

        .hero-bottom {
            margin-top: 70px;
            display: flex;
            justify-content: space-between;
            align-items: end;
            max-width: 1050px;
        }

        .hero-description {
            max-width: 390px;
            color: var(--soft);
            font-size: 15px;
            line-height: 1.8;
        }

        .hero-description strong {
            color: white;
        }
    </style>
</head>
<body>
    <div class="cursor"></div>
    <nav class="nav">
        <a href="#home" class="logo">ACE <span>SPECTRA</span></a>
        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>
    <main>
        <section class="hero" id="home">
            <div class="shape shape-ring"></div>
            <div class="shape shape-square"></div>
            <div class="shape shape-dot-grid"></div>
            <div class="shape shape-line"></div>
            <div class="shape shape-blur"></div>
            <div class="shape shape-star">✦</div>
            <div class="hero-content">
                <h1 class="hero-title reveal">
                    ACE
                    <br>
                    <span class="outline indent">SPECTRA</span>
                </h1>
            </div>
        </section>
    </main>
    <script>
        const cursor = document.querySelector(".cursor");

        document.addEventListener("mousemove", event => {
            cursor.style.left = `${event.clientX}px`;
            cursor.style.top = `${event.clientY}px`;
        });

        document.querySelectorAll("a").forEach(link => {
            link.addEventListener("mouseenter", () => {
                cursor.classList.add("active");
            });

            link.addEventListener("mouseleave", () => {
                cursor.classList.remove("active");
            });
        });

        const revealElements = document.querySelectorAll(".reveal");

        const revealObserver = new IntersectionObserver(
            entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("visible");
                        revealObserver.unobserve(entry.target);
                    }
                });
            },
            {
                threshold: 0.12
            }
        );

        revealElements.forEach(element => {
            revealObserver.observe(element);
        });

        const parallaxShapes = document.querySelectorAll(".shape");

        window.addEventListener("mousemove", event => {
            const x = (event.clientX / window.innerWidth - 0.5) * 2;
            const y = (event.clientY / window.innerHeight - 0.5) * 2;

            parallaxShapes.forEach((shape, index) => {
                const strength = (index + 1) * 4;
                shape.style.transform = `translate(${x * strength}px, ${y * strength}px)`;
            });
        });

        const hero = document.querySelector(".hero");

        window.addEventListener("scroll", () => {
            const scroll = window.scrollY;

            if (scroll < window.innerHeight) {
                hero.querySelector(".hero-content").style.transform = `translateY(${scroll * 0.12}px)`;
            }
        });
    </script>
</body>
</html>
